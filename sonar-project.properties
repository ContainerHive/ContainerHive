# SonarCloud analysis configuration
#
# This file is read by SonarCloud automatic analysis (GitHub App).
# The project key and organization come from the SonarCloud GitHub binding.

# Exclude test fixtures and sample projects from analysis
sonar.exclusions=**/testdata/**,example/**,test-project/**

# Go test files are tests, not production sources
sonar.tests=**/*_test.go
sonar.test.exclusions=**/testdata/**,example/**,test-project/**

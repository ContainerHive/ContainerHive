# SonarCloud automatic analysis configuration
#
# SonarQube Cloud automatic analysis reads this file and ignores
# sonar-project.properties, which is used for CI-based analysis only.
# The project key and organization come from the SonarCloud GitHub binding.

# Exclude test fixtures, sample projects, and build scripts from analysis
sonar.exclusions=**/testdata/**,example/**,test-project/**,scripts/**

# Go test files (suffix _test.go) are detected as tests automatically,
# so sonar.tests is not set. sonar.tests does not support wildcards.
sonar.test.exclusions=**/testdata/**,example/**,test-project/**,scripts/**

# Do not flag duplicated lines in test code
sonar.cpd.exclusions=**/*_test.go,**/testdata/**,example/**,test-project/**,scripts/**

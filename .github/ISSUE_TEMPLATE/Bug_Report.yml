---
name: 🐛 Bug Report
description: File a bug report for ContainerHive
labels:
  - bug
assignees:
  - timo-reymann
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: Provide some details about the error, for example what you
        have done before it occurred.
    validations:
      required: true
  - type: textarea
    id: expected-behaviour
    attributes:
      label: Expected behaviour
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual-behaviour
    attributes:
      label: Actual behaviour
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: List the steps required to reproduce the issue. Include the
        hive configuration and Dockerfiles, if possible.
      placeholder: |
        1. Run `ch ...` with this `hive.yaml` ...
        2. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ContainerHive version
      description: Output of `ch --version` or the version of the CI image you use.
      placeholder: "ch version 1.2.3 (commit abc1234, built 2026-01-01)"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform / environment
      description: Where did the issue occur?
      options:
        - pre-commit
        - CI - GitHub Actions
        - CI - GitLab CI
        - CI - CircleCI
        - CLI - Linux
        - CLI - macOS
        - CLI - Windows
        - Container image
    validations:
      required: true
  - type: dropdown
    id: container-runtime
    attributes:
      label: Container runtime / BuildKit
      description: Which runtime or BuildKit setup did you use?
      options:
        - Docker (desktop)
        - Docker Engine
        - Podman
        - nerdctl / containerd
        - BuildKit standalone or rootless
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste the relevant output or error message. Set
        `CH_LOG_LEVEL=debug` to get debug logs.
      render: shell
  - type: textarea
    id: more-info
    attributes:
      label: Important Factoids
      description: Is there anything atypical or special about your setup or example?
  - type: textarea
    id: references
    attributes:
      label: References
      description: |
        Are there any other GitHub issues (open or closed) or pull requests
        that should be linked here? Vendor documentation?
      placeholder: "You can reference issues with #"
  - type: checkboxes
    id: terms
    attributes:
      label: I read and agree to the contribution guidelines
      description: |
        By submitting this issue, you read and agree to the
        [contribution guidelines](https://github.com/ContainerHive/ContainerHive/blob/main/CONTRIBUTING.md).
      options:
        - label: I read and agree to the contribution guidelines
          required: true

tag_ranges:
  - tag_name: "{{.major}}.{{.minor}}"
    source:
      type: json
      url: "https://builds.dotnet.microsoft.com/dotnet/release-metadata/8.0/releases.json"
      transform: |
        releases.{ "version": sdk.version }
    select:
      major: all
      minor: all
      patch: latest
    versions:
      dotnet-sdk: "{{.full}}"
  - tag_name: "{{.major}}.{{.minor}}"
    source:
      type: json
      url: "https://builds.dotnet.microsoft.com/dotnet/release-metadata/9.0/releases.json"
      transform: |
        releases.{ "version": sdk.version }
    select:
      major: all
      minor: all
      patch: latest
    versions:
      dotnet-sdk: "{{.full}}"
  - tag_name: "{{.major}}.{{.minor}}"
    source:
      type: json
      url: "https://builds.dotnet.microsoft.com/dotnet/release-metadata/10.0/releases.json"
      transform: |
        releases.{ "version": sdk.version }
    select:
      major: all
      minor: all
      patch: latest
    versions:
      dotnet-sdk: "{{.full}}"

variants:
  - name: node
    tag_suffix: -node
    versions:
      nodejs: "24"

build_args:
  foo: bar

secrets:
  foo:
    value: bar

platforms:
  - linux/amd64